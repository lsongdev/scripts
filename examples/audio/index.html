<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Audio example</title>
</head>
<body>
  <h1>Web Audio</h1>
  <p>Playback begins only after an explicit action.</p>
  <button type="button" data-note="A4">Play A4</button>
  <button type="button" data-noise="white">Play white noise</button>
  <button type="button" data-noise="pink">Play pink noise</button>
  <button type="button" id="stop">Stop</button>
  <script type="module" src="./index.js"></script>
</body>
</html>
