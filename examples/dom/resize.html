<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Resizable controller</title>
  <style>#boundary{border:1px solid;width:400px;height:240px}#panel{background:#e0f7fa;box-sizing:border-box;height:100px;width:160px}#handle{cursor:nwse-resize;float:right}</style>
</head>
<body>
  <h1>Resizable controller</h1>
  <div id="boundary"><div id="panel">Panel <button id="handle" type="button" aria-label="Resize panel">↘</button></div></div>
  <output id="size">160x100</output>
  <script type="module">
    import { bindResizable } from '../../dom/resizable.js';
    const panel = document.querySelector('#panel');
    const handle = document.querySelector('#handle');
    const dispose = bindResizable(handle, {
      target: panel, boundary: document.querySelector('#boundary'),
      minWidth: 100, minHeight: 80,
    });
    handle.addEventListener('resize', event => {
      document.querySelector('#size').value = `${Math.round(event.detail.width)}x${Math.round(event.detail.height)}`;
    });
    addEventListener('pagehide', dispose);
  </script>
</body>
</html>
