<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Movable controller</title>
  <style>#boundary{border:1px solid;width:320px;height:180px;padding:1rem}#target{background:orange;width:80px;height:60px}</style>
</head>
<body>
  <h1>Movable controller</h1>
  <div id="boundary"><button id="target" type="button">Drag me</button></div>
  <output id="position">0,0</output>
  <script type="module">
    import { bindMovable } from '../../dom/movable.js';
    const target = document.querySelector('#target');
    const controller = bindMovable(target, { target, boundary: document.querySelector('#boundary'), grid: 5 });
    target.addEventListener('move', event => {
      document.querySelector('#position').value = `${event.detail.position.x},${event.detail.position.y}`;
    });
    addEventListener('pagehide', controller.dispose);
  </script>
</body>
</html>
