<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dialog Component</title>
  <style>
    dialog { max-inline-size: 32rem; border: 1px solid ButtonBorder; border-radius: 0.5rem; }
    dialog::backdrop { background: rgb(0 0 0 / 35%); }
    form { display: grid; gap: 0.75rem; }
    .dialog-close { justify-self: end; }
  </style>
</head>

<body>
  <h1>Dialog Component</h1>

  <dialog id="notificationDialog" class="dialog dialog-notification">
    <form method="dialog">
      <h3>Notification</h3>
      <p>This is a notification message in the top right corner.</p>
      <button class="dialog-close" value="close">&times;</button>
    </form>
  </dialog>

  <dialog id="drawerDialog" class="dialog dialog-drawer-right">
    <form method="dialog">
      <h3>Drawer</h3>
      <p>This is a side drawer content on the right side.</p>
      <button class="dialog-close" value="close">&times;</button>
    </form>
  </dialog>

  <dialog id="bottomDialog" class="dialog dialog-drawer-bottom">
    <form method="dialog">
      <h3>Bottom Drawer</h3>
      <p>This is a bottom drawer content at the bottom of the page.</p>
      <button class="dialog-close" value="close">&times;</button>
    </form>
  </dialog>

  <dialog id="toastDialog" class="dialog dialog-toast">
    This is a toast message at the top center.
  </dialog>

  <button id="showNotification">Show Notification</button>
  <button id="showDrawer">Show Drawer</button>
  <button id="showBottomDrawer">Show Bottom Drawer</button>
  <button id="showToast">Show Toast</button>
  <button id="showConfirm">Show Confirm</button>

  <script type="module">

    import { bindDialog, confirmDialog, showDialog } from '../../dom/dialog.js';

    document.querySelectorAll('dialog').forEach(dialog => bindDialog(dialog));

    function showToast() {
      const toast = document.getElementById('toastDialog');
      toast.show();
      setTimeout(() => toast.close(), 3000);
    }

    document.getElementById('showNotification').addEventListener('click', () => showDialog(document.getElementById('notificationDialog')));
    document.getElementById('showDrawer').addEventListener('click', () => showDialog(document.getElementById('drawerDialog')));
    document.getElementById('showBottomDrawer').addEventListener('click', () => showDialog(document.getElementById('bottomDialog')));
    document.getElementById('showToast').addEventListener('click', showToast);
    document.getElementById('showConfirm').addEventListener('click', async () => {
      const confirmed = await confirmDialog('您确定要继续吗?', { title: '操作确认' });
      console.log({ confirmed });
    });
  </script>
</body>

</html>
