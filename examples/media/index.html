<h1>Media API Example</h1>
<script type="module" src="./index.js"></script>

<div class="panel">
  <h3 class="panel-header">Devices</h3>
  <form class="panel-body">
    <button id="refresh" type="button">List devices</button>
    <div class="form-field">
      <label for="audioinputs">Audio Input:</label>
      <select id="audioinputs"></select>
    </div>
    <div class="form-field">
      <label for="audiooutputs">Audio Output:</label>
      <select id="audiooutputs"></select>
    </div>
    <div class="form-field">
      <label for="videoinputs">Video Output:</label>
      <select id="videoinputs"></select>
    </div>
  </form>
  <div class="panel-footer">
  </div>
</div>

<div class="panel">
  <h3 class="panel-header">Explicit camera element</h3>
  <camera-view></camera-view>
  <button id="camera-view-start" type="button">Start camera view</button>
  <button id="camera-view-stop" type="button">Stop camera view</button>
</div>

<div class="panel">
  <h3 class="panel-header">Media</h3>
  <div class="panel-body">
    <video></video>
  </div>
  <div class="panel-footer">
    <button id="camera" class="button">camera</button>
    <button id="screen" class="button">screen</button>
    <button id="stop" class="button">stop</button>
  </div>
</div>
