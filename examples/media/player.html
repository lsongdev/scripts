<script type="importmap">
  {
    "imports": {
      "htm": "https://esm.sh/htm@3.1.1",
      "preact": "https://esm.sh/preact@10.29.8",
      "preact/hooks": "https://esm.sh/preact@10.29.8/hooks"
    }
  }
</script>
<script type="module">
  import { defineElement } from '../../elements/define.js';
  import { render, h } from '../../adapters/preact/index.js';

  const react = App => {
    return class extends HTMLElement {
      connectedCallback() {
        const props = [...this.attributes].reduce((props, attr, i) => {
          props[attr.name] = attr.value;
          return props;
        }, {});
        render(h(App, props), this);
      }
    }
  };

  defineElement('music-player', react(props => {
    const { playlist } = props;
    return h('div', { className: 'music-player' }, [
      h('div', { className: 'music-player-container' }, [
        h('img', { className: 'music-player-cover' }),
        h('div', { className: 'music-player-info' }, [
          h('h4', null, "Test"),
          h('span', null, "Test"),
        ]),
      ]),
    ]);
  }));
</script>
<music-player playlist=""></music-player>
